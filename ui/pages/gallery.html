<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  var FILES = __FILE_JSON__;
  var INITIAL_TAGGED = __TAGGED__;
  var REC = __REC__;
  var HASSUBS = __HASSUBS__;
  var DIRQ = __DIRQ__;
  var SEARCHQ = __SEARCHQ__;   // requete si /files?q= (page de resultats globale), sinon ''
  // La grille est-elle un RESULTAT (?q=, ?sim=, ?jour=) plutot que le fonds ?
  // Alors une recherche IA « dedans » n'intersecterait que ce sous-ensemble
  // avec les 200 plus proches du FONDS : « ours en peluche » sur la page d'un
  // 11 avril rendait 0 (29/08). Meme regle que SEARCHQ : Entree relance.
  var GRILLE_RESULTAT = __GRILLE_RESULTAT__ === 1;
  // 30/08 (Mike) : « ours en peluche » tape sur /files rendait 0 photo. La
  // grille par defaut est le dossier _Uploads (20 photos) et une recherche IA
  // « dedans » n'intersectait que ce dossier avec les 200 plus proches du
  // FONDS. Aucune grille n'est le fonds entier (1 500 au plus) : une
  // recherche IA passe donc TOUJOURS par le serveur (/files?q=), qui classe
  // le fonds et compte vrai. Le « filtrer dans cette grille » honnete (classer
  // la grille entiere) reste a faire — ROADMAP 1 nonies.
  var IA_PAR_LE_SERVEUR = true;
  var SEARCHMETA = __SEARCHMETA__;  // ce que le serveur a compris de SEARCHQ ({} sinon)
  var MOTIFS = __MOTIFS__;
  var sorted = FILES.slice();
  var visible = FILES.slice();
  var currentSort = '';     // defini au premier appel de sortBy
  var sortAsc = true;       // chronologique par defaut : du plus ancien au plus recent
  var observer;
  var lbIdx = 0;
  var TAGDATA = __TAGDATA__;
  var selTags = (TAGDATA.sel || []).slice();
  var mode = TAGDATA.mode === 'or' ? 'or' : 'and';
  var selPersons = [];      // tags "personne:Nom" sélectionnés (filtre client, ET)
  var geoFilter = null;     // {lat, lon, km} ou null
  var qInput = document.getElementById('q');
  qInput.value = new URLSearchParams(location.search).get('q') || '';
  var qTimer = null;
  qInput.addEventListener('input', function() {
    if (qTimer) clearTimeout(qTimer);
    // Sur une page de RESULTATS (`/files?q=`), FILES ne contient que le
    // resultat de la requete precedente : chercher a chaque frappe
    // n'intersecterait que CE sous-ensemble — « 3 photos » la ou le fonds en
    // a 354 (observe le 21/08). On attend une intention explicite. Hors mode
    // IA, la barre FILTRE des mots-cles dans la planche : la, filtrer dans ce
    // qui est charge est exactement ce qu'on demande.
    if (modeIA && (SEARCHQ || GRILLE_RESULTAT || IA_PAR_LE_SERVEUR)) { majIndiceRelance(); return; }
    qTimer = setTimeout(modeIA ? rechercheIA : applyFilter, modeIA ? 450 : 250);
  });
  qInput.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (qTimer) clearTimeout(qTimer);
    if (modeIA && (SEARCHQ || GRILLE_RESULTAT || IA_PAR_LE_SERVEUR)) { relancerCoteServeur(qInput.value); return; }
    if (modeIA) rechercheIA(); else applyFilter();
  });

  // Relance la requete COTE SERVEUR : la seule facon d'obtenir un compte vrai
  // depuis une page de resultats. Un seul chemin, partage par les puces et par
  // la touche Entree.
  function relancerCoteServeur(texte) {
    var t = (texte || '').trim();
    location.href = t ? '/files?q=' + encodeURIComponent(t) : '/files';
  }

  function majIndiceRelance() {
    var el = document.getElementById('relance');
    if (!el) return;
    var differe = modeIA && (SEARCHQ || GRILLE_RESULTAT || IA_PAR_LE_SERVEUR) && qInput.value.trim() !== SEARCHQ
                  && qInput.value.trim() !== '';
    el.style.display = differe ? '' : 'none';
  }

  // ── recherche semantique (SigLIP 2) ──
  // Le filtre habituel compare des mots-cles ; ce mode-ci compare le SENS.
  // « chat endormi sur le canape » fonctionne sans qu'aucun de ces mots
  // n'apparaisse dans les tags.
  var modeIA = false, iaResultats = null, iaJeton = 0, iaCompris = '',
      iaEcartees = 0, iaSansOrdre = 0, iaTronque = 0, iaTotal = 0;

  // Lit la decomposition renvoyee par le serveur (/api/search ou __SEARCHMETA__)
  // et remplit les trois variables d'affichage. UNE seule implementation : les
  // deux chemins arrivent sur la meme page et doivent dire la meme chose.
  //   iaCompris   — ce qui a ete compris (qui, ou, quand, puis le sens) ;
  //   iaEcartees  — photos EXCLUES faute d'une date assez precise ;
  //   iaSansOrdre — photos RENDUES mais sans aucune date sure : elles sont en
  //                 fin de liste, et le taire ferait passer un classement
  //                 degrade pour un classement.
  function lireDecomposition(d) {
    var bouts = [];
    if (d.noms && d.noms.length) bouts.push(d.noms.join(' + '));
    if (d.lieux && d.lieux.length) bouts.push(d.lieux.join(' + '));
    // 5e axe : un FILTRE, pas du sens. Le dire evite qu'une requete qui
    // restreint en silence passe pour un fonds pauvre.
    if (d.especes && d.especes.length)
      bouts.push('espece : ' + d.especes.join(' + '));
    if (d.especes_inconnues && d.especes_inconnues.length)
      bouts.push('espece inconnue : ' + d.especes_inconnues.join(', ')
                 + ' (aucune photo)');
    // Un jeton que le moteur ne sait pas satisfaire rend ZERO photo, et le
    // DIT — la regle de `espece:licorne`, etendue le 26/08 aux quatre autres
    // axes. Sans cette ligne, la page affichait 1500 photos pour un nom
    // invente : un filtre muet se lit comme un accord.
    if (d.noms_inconnus && d.noms_inconnus.length)
      bouts.push('inconnu au fichier : ' + d.noms_inconnus.join(', ')
                 + ' (aucune photo)');
    if (d.axes_inconnus && d.axes_inconnus.length)
      bouts.push('filtre inconnu : ' + d.axes_inconnus.join(': , ')
                 + ': (aucune photo)');
    if (d.periode) bouts.push(d.periode);
    // L'elargissement FR->EN (30/08) : le moteur encode AUSSI la forme
    // anglaise de la requete quand il la connait ; il le dit ici, entre
    // parentheses, pour que « ours en peluche (+ teddy bear) » se lise.
    if (d.reste) bouts.push(d.reste + (d.elargi ? ' (+ ' + d.elargi + ')' : ''));
    iaCompris = bouts.join(' · ');
    iaEcartees = d.sans_date || 0;
    iaSansOrdre = d.sans_date_tri || 0;
    iaTronque = d.tronque || 0;
    iaTotal = d.total || 0;
    majEspeceChips(d.especes || []);
  }
  // ── 5e axe : les puces d'espece ──────────────────────────────────────
  // Les six especes que YOLO sait detecter. La liste vit ici en dur parce que
  // c'est celle du DETECTEUR, pas une preference : elle ne change qu'avec le
  // modele. Cote serveur, la meme liste est dans `faits_vue.ESPECES_MOTS`.
  var ESPECES = ['chat', 'chien', 'oiseau', 'cheval', 'vache', 'mouton'];
  // Pluriels acceptes a la lecture : l'utilisateur ecrira « espece:chats ».
  var ESPECE_FORMES = {chat: 'chats', chien: 'chiens', oiseau: 'oiseaux',
                       cheval: 'chevaux', vache: 'vaches', mouton: 'moutons'};
  // Motif construit en CHAINE, pas en litteral : cette page vit dans une
  // chaine Python, ou une classe d'echappement (antislash-s) serait lue comme
  // une sequence d'echappement invalide. Les espaces suffisent — une requete
  // tapee n'a pas de tabulations.
  var RE_ESPECE = 'esp[eè]ces?[ ]*:[ ]*([^ ,;]+)';

  function especeDuJeton(valeur) {
    var v = String(valeur || '').toLowerCase();
    for (var i = 0; i < ESPECES.length; i++)
      if (v === ESPECES[i] || v === ESPECE_FORMES[ESPECES[i]]) return ESPECES[i];
    return null;                       // inconnue : on la laisse ou elle est
  }

  // Retire de la requete les jetons qui designent CETTE espece, et rend le
  // texte nettoye. Ne touche a rien d'autre : les noms, lieux et dates tapes
  // a cote doivent survivre a un clic sur une puce.
  function sansEspece(texte, mot) {
    return texte.replace(new RegExp(RE_ESPECE, 'gi'), function(tout, val) {
      return especeDuJeton(val) === mot ? ' ' : tout;
    }).replace(/  +/g, ' ').trim();
  }

  function basculerEspece(mot) {
    var avant = qInput.value;
    var apres = sansEspece(avant, mot);
    // Rien n'a bouge => l'espece n'y etait pas : on l'AJOUTE a la fin.
    if (apres === avant.replace(/  +/g, ' ').trim())
      apres = (apres + ' espece:' + mot).trim();
    qInput.value = apres;
    if (qTimer) clearTimeout(qTimer);
    // Sur une page de RESULTATS servie par le serveur, FILES ne contient que
    // le resultat de la requete PRECEDENTE : filtrer dedans afficherait
    // « 3 photos » la ou le fonds en a 349 — un compte qui ment, la forme
    // d'erreur la plus chere du projet. Une puce cliquee est une intention
    // EXPLICITE : on relance la requete cote serveur.
    if (SEARCHQ || GRILLE_RESULTAT || IA_PAR_LE_SERVEUR) { relancerCoteServeur(apres); return; }
    if (apres) rechercheIA(); else { iaResultats = null; majEspeceChips([]);
                                     oublierPertinence(); }
  }

  // L'etat des puces vient de ce que le SERVEUR a compris, jamais d'une
  // relecture locale de la requete : une page qui deduit son propre etat finit
  // par contredire le moteur — c'est exactement la regression du 20/08.
  function majEspeceChips(especes) {
    var actives = {};
    (especes || []).forEach(function(m) { actives[m] = true; });
    var box = document.getElementById('especechips');
    if (!box.firstChild) {
      ESPECES.forEach(function(mot) {
        var b = document.createElement('button');
        b.className = 'chip';
        b.type = 'button';
        b.textContent = mot;
        b.setAttribute('aria-pressed', 'false');
        b.title = 'Filtre exact : la detection et la description disent « '
                  + mot + ' »';
        b.onclick = function() { basculerEspece(mot); };
        box.appendChild(b);
        box.appendChild(document.createTextNode(' '));
      });
    }
    var puces = box.getElementsByTagName('button');
    for (var i = 0; i < puces.length; i++) {
      var on = !!actives[puces[i].textContent];
      puces[i].className = 'chip' + (on ? ' on' : '');
      puces[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function montrerEspeceBar(oui) {
    document.getElementById('especebar').style.display = oui ? '' : 'none';
    if (oui) majEspeceChips(null);      // construit les puces au premier appel
  }

  var btnIA = document.getElementById('btn-ia');
  btnIA.addEventListener('click', function() {
    modeIA = !modeIA;
    btnIA.className = 'btn tb' + (modeIA ? ' active' : '');
    btnIA.setAttribute('aria-pressed', modeIA ? 'true' : 'false');
    qInput.placeholder = modeIA ? 'Décris la photo…' : 'Recherche tags…';
    iaResultats = null;
    montrerEspeceBar(modeIA);
    majIndiceRelance();
    // Sans classement, « Pertinence » n'a plus de sens : on retombe sur la date
    // plutot que de laisser un bouton actif sans ordre derriere lui.
    if (currentSort === 'pertinence') { currentSort = ''; sortAsc = true; }
    if (modeIA && qInput.value.trim()) {
      if (IA_PAR_LE_SERVEUR) { relancerCoteServeur(qInput.value); return; }
      rechercheIA();
    }
    else if (currentSort === '') sortBy('date');
    else { updateSortButtons(); applyFilter(); }
    if (modeIA) qInput.focus();
  });

  // Un classement qui disparait (requete vidée, erreur, sortie du mode IA)
  // doit emporter le bouton qui le nomme, sinon « Pertinence » reste allume
  // devant une liste qu'il ne classe plus.
  function oublierPertinence() {
    if (currentSort === 'pertinence') { currentSort = ''; sortAsc = true; sortBy('date'); }
    else { updateSortButtons(); applyFilter(); }
  }

  function rechercheIA() {
    var t = qInput.value.trim();
    if (!t) { iaResultats = null; majEspeceChips([]); oublierPertinence();
              return; }
    var jeton = ++iaJeton;                 // ignore les reponses hors delai
    var cnt = document.getElementById('cnt');
    cnt.textContent = 'recherche…';
    fetch('/api/search?q=' + encodeURIComponent(t) + '&n=200')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (jeton !== iaJeton) return;
        if (d.error) { cnt.textContent = d.error; iaResultats = null;
                       updateSortButtons(); return; }
        iaResultats = {};
        (d.results || []).forEach(function(x, i) { iaResultats[x.key] = i; });
        currentSort = 'pertinence';    // et le bouton le DIT
        updateSortButtons();
        // Rend visible ce que la requete a compris. Les trois premieres
        // dimensions sont des FILTRES EXACTS (qui, ou, quand), la derniere du
        // SENS. L'afficher n'est pas cosmetique : sans ca, une requete qui
        // filtre en silence est une requete qu'on n'ose plus croire.
        // Avant le 15/08 seul « qui » etait montre : une recherche par lieu
        // seul filtrait sans jamais le dire.
        lireDecomposition(d);
        applyFilter();
      })
      .catch(function() {
        if (jeton === iaJeton) cnt.textContent = 'recherche indisponible';
      });
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── sort (reversible) ──
  // « Date » = date de PRISE (taken, repli mtime), du plus ancien au plus recent
  // par defaut ; un reclic sur le meme bouton inverse le sens. « Nom » de meme
  // (A-Z par defaut, reclic = Z-A). Le diaporama « Demo » suit ensuite cet ordre.
  function photoTime(f){ return f.taken || f.mtime || 0; }
  // `sd` : le serveur a marque cette photo comme n'ayant AUCUNE date sure
  // (ni precise, ni annee de dossier). Absent = datee.
  function sansDate(f){ return !!f.sd; }
  // Trois ordres possibles, jamais deux : 'date', 'name' et 'pertinence' —
  // celui que le SERVEUR a rendu pour une requete. Avant le 19/08 il n'avait
  // pas de nom : la page de resultats affichait « Date ↑ » allume alors que
  // l'ordre venait de /api/search, et cliquer sur « Date » ne changeait rien
  // (applyFilter re-triait par pertinence derriere). Un bouton qui ment est
  // pire qu'un bouton absent.
  function updateSortButtons() {
    var d = document.getElementById('btn-date'), n = document.getElementById('btn-name'),
        p = document.getElementById('btn-rel');
    // « Pertinence » n'existe que quand un classement a ete rendu : proposer un
    // ordre qu'on ne saurait pas produire serait un troisieme mensonge.
    p.style.display = iaResultats ? '' : 'none';
    p.className = 'btn tb' + (currentSort==='pertinence' ? ' active' : '');
    p.title = 'Ordre rendu par la recherche : la photo la plus proche de la requete en tete';
    d.className = 'btn tb' + (currentSort==='date' ? ' active' : '');
    n.className = 'btn tb' + (currentSort==='name' ? ' active' : '');
    d.setAttribute('aria-pressed', currentSort==='date' ? 'true' : 'false');
    n.setAttribute('aria-pressed', currentSort==='name' ? 'true' : 'false');
    p.setAttribute('aria-pressed', currentSort==='pertinence' ? 'true' : 'false');
    d.textContent = 'Date ' + (currentSort==='date' ? (sortAsc ? '↑' : '↓') : '');
    n.textContent = currentSort==='name' ? ('Nom ' + (sortAsc ? 'A→Z' : 'Z→A')) : 'Nom A-Z';
    d.title = currentSort==='date'
      ? 'Chronologique — ' + (sortAsc ? 'du plus ancien au plus recent' : 'du plus recent au plus ancien') + ' (reclic pour inverser)'
      : 'Trier par date de prise';
    n.title = 'Trier par nom' + (currentSort==='name' ? ' (reclic pour inverser)' : '');
  }
  function sortBy(m) {
    if (m === 'pertinence') {          // l'ordre vient du serveur : rien a trier
      currentSort = 'pertinence';
      updateSortButtons();
      applyFilter();
      return;
    }
    if (m === currentSort) sortAsc = !sortAsc;     // reclic = inverse le sens
    else { currentSort = m; sortAsc = true; }       // nouveau tri = sens par defaut
    updateSortButtons();
    var s = FILES.slice();
    if (m === 'date') {
      // Une photo sans aucune date sure n'est ni recente ni ancienne : elle est
      // INCONNUE. La classer par `photoTime` revient a la dater de son dernier
      // tagging (2026) — invisible en ordre croissant, ou elle tombe en fin par
      // accident, mais elle passait EN TETE au reclic. On la range donc en fin
      // dans les DEUX sens, par nom pour que la page soit reproductible.
      var datees = [], muettes = [];
      s.forEach(function(f) { (sansDate(f) ? muettes : datees).push(f); });
      datees.sort(function(a,b){ return photoTime(a) - photoTime(b); });
      if (!sortAsc) datees.reverse();
      muettes.sort(function(a,b){ return a.name.localeCompare(b.name); });
      s = datees.concat(muettes);
    } else {
      s.sort(function(a,b){ return a.name.localeCompare(b.name); });
      if (!sortAsc) s.reverse();
    }
    sorted = s;
    applyFilter();
  }

  // ── tags (barre repliable, tags du dossier + sous-dossiers via l'index) ──
  function tagNavUrl(tags, m) {
    var p = ['dir=' + encodeURIComponent(DIRQ || '0')];
    if (tags.length) {
      p.push('tags=' + encodeURIComponent(tags.join(',')));
      p.push('tmode=' + m);
    }
    return '/files?' + p.join('&');
  }

  function buildTagbar() {
    var tagsArr;
    if (TAGDATA.counts && TAGDATA.counts.length) {
      tagsArr = TAGDATA.counts;           // index serveur : récursif
    } else {
      var counts = {};
      FILES.forEach(function(f) {
        (f.kw || []).forEach(function(t) { counts[t] = (counts[t] || 0) + 1; });
      });
      tagsArr = Object.keys(counts)
        .sort(function(a, b) { return counts[b] - counts[a]; })
        .slice(0, 40)
        .map(function(t) { return [t, counts[t]]; });
    }
    var bar = document.getElementById('tagbar');
    bar.innerHTML = '';
    if (!tagsArr.length) {
      bar.innerHTML = '<span class="tagbar-label">Aucun mot-cl&eacute; pour le moment &mdash; le tagging IA les ajoute automatiquement.</span>';
      return;
    }
    // navigation serveur quand la page ne contient pas toutes les photos du sous-arbre
    var srvNav = selTags.length > 0 || (HASSUBS && !REC);

    var collapsed = true;
    try { collapsed = localStorage.getItem('tagbarOpen') !== '1'; } catch (e) {}
    if (selTags.length) collapsed = false;

    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'chip mode';
    toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    var wrap = document.createElement('div');
    wrap.className = 'tagchips' + (collapsed ? ' hidden' : '');

    function updToggle() {
      toggle.textContent = (collapsed ? '▸' : '▾') + ' Filtres'
        + (selTags.length ? ' — ' + selTags.length + ' actif' + (selTags.length > 1 ? 's' : '') : '')
        + ' (' + tagsArr.length + ' tags)';
    }
    toggle.onclick = function() {
      collapsed = !collapsed;
      wrap.className = 'tagchips' + (collapsed ? ' hidden' : '');
      toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      try { localStorage.setItem('tagbarOpen', collapsed ? '0' : '1'); } catch (e) {}
      updToggle();
    };
    bar.appendChild(toggle);

    var modeBtn = document.createElement('button');
    modeBtn.type = 'button';
    modeBtn.className = 'chip mode';
    modeBtn.id = 'modeBtn';
    modeBtn.textContent = (mode === 'and') ? 'ET' : 'OU';
    modeBtn.title = 'Combiner les mots-cles en ET ou en OU';
    modeBtn.onclick = function() {
      mode = (mode === 'and') ? 'or' : 'and';
      modeBtn.textContent = (mode === 'and') ? 'ET' : 'OU';
      if (srvNav && selTags.length) { location.href = tagNavUrl(selTags, mode); return; }
      applyFilter();
    };
    wrap.appendChild(modeBtn);

    tagsArr.forEach(function(tn) {
      var t = tn[0], n = tn[1];
      var c = document.createElement('button');
      c.type = 'button';
      var on = selTags.indexOf(t) >= 0;
      c.className = 'chip' + (on ? ' on' : '');
      // `on` peint, `aria-pressed` DIT. La classe seule laissait un lecteur
      // d'ecran annoncer un filtre actif exactement comme un inactif.
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.innerHTML = esc(t) + '<span class="n">' + n + '</span>';
      c.onclick = function() {
        var i = selTags.indexOf(t);
        if (srvNav) {
          var ns = selTags.slice();
          if (i >= 0) ns.splice(ns.indexOf(t), 1); else ns.push(t);
          location.href = tagNavUrl(ns, mode);
          return;
        }
        if (i >= 0) selTags.splice(i, 1); else selTags.push(t);
        c.className = 'chip' + (i < 0 ? ' on' : '');
        c.setAttribute('aria-pressed', i < 0 ? 'true' : 'false');
        document.getElementById('clearBtn').style.display = selTags.length ? 'inline-flex' : 'none';
        updToggle();
        applyFilter();
      };
      wrap.appendChild(c);
    });

    var clr = document.createElement('button');
    clr.type = 'button';
    clr.className = 'chip clear';
    clr.id = 'clearBtn';
    clr.textContent = 'Tout effacer';
    clr.style.display = selTags.length ? 'inline-flex' : 'none';
    clr.onclick = function() {
      if (srvNav) { location.href = tagNavUrl([], mode); return; }
      selTags = [];
      var chips = wrap.querySelectorAll('.chip.on');
      for (var i = 0; i < chips.length; i++) {
        chips[i].className = 'chip';
        chips[i].setAttribute('aria-pressed', 'false');
      }
      clr.style.display = 'none';
      updToggle();
      applyFilter();
    };
    wrap.appendChild(clr);

    bar.appendChild(wrap);
    updToggle();
  }

  function applyFilter() {
    var words = (modeIA ? [] : qInput.value.trim().toLowerCase()
                 .split(/[\s,;]+/).filter(Boolean));
    visible = sorted.filter(function(f) {
      var kw = f.kw || [];
      // En mode IA, seules les photos rapportees par /api/search passent ;
      // les filtres chips, personnes et geo restent cumulables.
      if (modeIA && iaResultats && iaResultats[f.key] === undefined) return false;
      if (selTags.length) {
        var okChips = (mode === 'and')
          ? selTags.every(function(t) { return kw.indexOf(t) >= 0; })
          : selTags.some(function(t) { return kw.indexOf(t) >= 0; });
        if (!okChips) return false;
      }
      if (selPersons.length) {
        for (var pp = 0; pp < selPersons.length; pp++) {
          if (kw.indexOf(selPersons[pp]) < 0) return false;
        }
      }
      if (geoFilter) {
        if (!f.gps) return false;
        if (haversine(geoFilter.lat, geoFilter.lon, f.gps[0], f.gps[1]) > geoFilter.km) return false;
      }
      if (words.length) {
        var hay = kw.join(' ') + ' ' + f.name.toLowerCase() + ' ' + (f.desc || '').toLowerCase();
        for (var i = 0; i < words.length; i++) {
          if (hay.indexOf(words[i]) < 0) return false;
        }
      }
      return true;
    });
    // Le classement par pertinence est l'ordre PAR DEFAUT d'une recherche —
    // c'est ce que l'utilisateur attend quand il vient de formuler une requete.
    // Mais il ne s'impose plus : jusqu'au 19/08, `modeIA && iaResultats`
    // suffisait, donc un clic sur « Date » etait avale sans rien dire.
    if (currentSort === 'pertinence' && iaResultats) {
      visible.sort(function(a, b) {
        return iaResultats[a.key] - iaResultats[b.key];
      });
    }
    renderGrid();
  }

  // ── vignettes serveur (audit O1) ──
  // La grille chargeait les ORIGINAUX (2-6 Mo/case lus sur le NAS) ; /api/thumb
  // sert un JPEG 512 px (grille) ou 1600 px (diaporama) avec cache disque, et
  // REDIRIGE vers l'original quand il ne sait pas (vidéo, format exotique) —
  // aucun cas particulier ici. La visionneuse (lightbox) garde l'original.
  function thumbUrl(f, s) {
    if (!f || !f.key) return f ? f.url : '';
    return '/api/thumb?key=' + encodeURIComponent(f.key) + '&s=' + (s || 512);
  }

  // ── grid ──
  // « date . lieu . noms » -- les faits que le serveur SAIT, calcules a la
  // demande (`faits_vue`), jamais lus dans un champ grave : sur les 81 photos
  // qui portent un `faits` en base, 12 divergent deja de l'index.
  // UN seul producteur pour la planche et la visionneuse : deux rendus du
  // meme fait finissent par se contredire, et c'est l'ecran qui ment.
  // `avecSrc` est la seule difference -- la planche est dense, la visionneuse
  // ne montre qu'une photo et a donc la place de dire la provenance.
  function faitsHtml(f, avecSrc) {
    var fa = f.faits;
    if (!fa) return '';
    function src(s) {
      return (avecSrc && s) ? ' <span class="src">(' + esc(s) + ')</span>' : '';
    }
    var p = [];
    if (fa.date) p.push('<span class="d">' + esc(fa.date) + '</span>' + src(fa.date_src));
    if (fa.lieu) p.push(esc(fa.lieu) + src(fa.lieu_src));
    if (fa.noms && fa.noms.length)
      p.push('<span class="n">' + esc(fa.noms.join(', ')) + '</span>');
    return p.join(' · ');
  }

  function renderGrid() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (observer) observer.disconnect();

    observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          var img = e.target.querySelector('img');
          if (img && img.dataset.src) {
            img.src = img.dataset.src;
            img.onload = function() { img.classList.add('loaded'); };
            img.onerror = function() {
              // vignette serveur KO (clé qui ne résout pas, cas rares) :
              // retenter UNE fois avec l'original avant de masquer la case.
              var fb = img.dataset.fb;
              if (fb && img.src.indexOf('/api/thumb') >= 0) {
                img.src = fb;
                return;
              }
              var c = img.closest('.cell');
              if (c) c.style.display = 'none';
            };
            delete img.dataset.src;
            observer.unobserve(e.target);
          }
        }
      });
    }, { rootMargin: '200px' });

    visible.forEach(function(f, i) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var cap = f.desc || '';
      var fh = faitsHtml(f, false);
      cell.innerHTML = '<div class="ph"><img data-src="' + thumbUrl(f, 512)
                     + '" data-fb="' + esc(f.url) + '" alt="" title="' + esc(f.name) + '">'
                     // `annee` n'est envoye qu'en mode « meme jour » : c'est la
                     // que le millesime porte le recit (2008, 2011, 2019).
                     + (f.annee ? '<span class="an">' + f.annee + '</span>' : '')
                     + (f.video ? '<span class="vid" aria-label="vid\u00e9o">\u25B6 ' + dureeTxt(f.duree) + '</span>' : '')
                     + '</div>'
                     // Rien a dire -> pas de ligne : une ligne vide sous
                     // chaque vignette couterait 43 064 fois la hauteur d'un
                     // fait absent.
                     + (fh ? '<div class="faits">' + fh + '</div>' : '')
                     + '<div class="caption' + (cap ? '' : ' empty') + '">'
                     + (cap ? esc(cap) : 'pas encore analysée') + '</div>';
      // Ouvrir une photo etait un geste de SOURIS uniquement : la planche
      // est la page la plus utilisee du site, et rien au clavier n'y
      // ouvrait quoi que ce soit (WCAG 2.1.1, niveau A).
      //
      // Pourquoi un `role="button"` et pas un vrai `<button>` : une cellule
      // porte une image, une ligne de faits et une legende, c'est-a-dire
      // des `<div>`. Un bouton n'admet que du contenu de phrase -- les
      // navigateurs tolerent le reste, mais un lecteur d'ecran lit alors
      // TOUT le contenu comme libelle du bouton, et une vignette annoncerait
      // trois lignes. L'element garde donc sa mise en page et recoit les
      // trois choses qui font un controle : on l'atteint, on l'annonce, on
      // l'actionne. `aria-label` dit ce que le clic FAIT, pas ce qu'on voit.
      cell.tabIndex = 0;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', 'Ouvrir ' + (f.name || 'la photo'));
      cell.onclick = function() { openLb(i); };
      cell.onkeydown = function(e) {
        // Espace est la touche d'un bouton autant qu'Entree, et sans
        // `preventDefault` elle fait defiler la page sous la photo.
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); }
      };
      grid.appendChild(cell);
      observer.observe(cell);
    });

    var txt = visible.length + ' photo(s)';
    if (selTags.length) txt += ' / ' + FILES.length;
    // C'est le tri par DATE qui range les muettes en fin : on le DIT, sinon la
    // fin de planche passe pour de vieilles photos. Le critere est l'ordre reel,
    // pas le mode : trier des resultats IA par date range les muettes ici aussi.
    // Quand l'ordre est la pertinence, le meme fait est porte par `iaSansOrdre`,
    // plus bas — jamais les deux.
    if (currentSort === 'date') {
      var nsd = 0;
      for (var vi = 0; vi < visible.length; vi++) if (visible[vi].sd) nsd++;
      if (nsd) txt += ' · ' + nsd + ' sans date connue, en fin de liste';
    }
    if (modeIA && iaCompris) txt += ' — ' + iaCompris;
    // Deux chiffres, deux sens : `iaEcartees` compte des photos ABSENTES de la
    // liste, `iaSansOrdre` des photos PRESENTES mais qu'aucune date ne permet
    // de classer. Les confondre serait pire que les taire.
    if (modeIA && iaEcartees)
      txt += ' (' + iaEcartees + ' sans date assez précise)';
    if (currentSort === 'pertinence' && iaSansOrdre)
      txt += ' · ' + iaSansOrdre + ' sans date connue, en fin de liste';
    // Un plafond qui ne se dit pas se lit comme une exhaustivite. Il n'apparait
    // que s'il a REELLEMENT coupe, et il donne le total, pas un « … ».
    if (modeIA && iaTronque)
      txt += ' · ' + iaTronque + ' de plus non affichées (sur ' + iaTotal
             + ' au total)';
    document.getElementById('cnt').textContent = txt;
  }

  // ── lightbox ──
  function openLb(i) {
    lbIdx = i;
    document.getElementById('lb').classList.add('open');
    showLb();
  }
  // Duree « m:ss » d'une video (phase 1) ; vide si inconnue.
  function dureeTxt(d) {
    if (!d) return '';
    d = Math.round(d); var m = Math.floor(d / 60), s = d % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function showLb() {
    var f = visible[lbIdx];
    var img = document.getElementById('lb-img'), vid = document.getElementById('lb-video');
    if (f.video) {
      // Une video se LIT : <video controls>, l'original en flux (Range gere
      // par le serveur). L'image reste vide pour ne pas charger deux fois.
      img.hidden = true; img.src = '';
      vid.hidden = false; vid.src = f.url;
    } else {
      vid.pause(); vid.removeAttribute('src'); vid.load(); vid.hidden = true;
      img.hidden = false; img.src = f.url;
    }
    document.getElementById('lb-name').textContent = f.name + '  (' + f.size + ')';
    // Les faits AVANT les tags : les premiers portent leur source, les
    // seconds sortent d'un modele. L'ordre de lecture dit lequel engage le
    // projet.
    var fx = document.getElementById('lb-faits');
    var fh = faitsHtml(f, true);
    fx.innerHTML = fh || 'ni date, ni lieu, ni nom connus';
    fx.className = fh ? '' : 'none';
    // Les noms sont DEJA dans la ligne de faits, triés, sans préfixe et avec
    // leur source : les répéter en « personne:Cédric Baudin » sous cette ligne
    // était du bruit, et le préfixe est un détail d'implémentation qui n'a
    // rien à faire sous les yeux de la famille. Le FILTRE de la planche, lui,
    // garde les tags nommés : y chercher « personne:Luna » a du sens.
    var t = document.getElementById('lb-tags');
    var libres = (f.kw || []).filter(function(k) {
      var kl = String(k).toLowerCase();
      return kl.indexOf('personne:') !== 0 && kl.indexOf('animal:') !== 0;
    });
    if (libres.length) { t.textContent = libres.join(' · '); t.className = ''; }
    // Etat vide RÉDIGÉ (plancher photo-ui n° 7) : « pas encore de tags »
    // mentirait sur une photo qui n'a QUE des noms — elle a bien été nommée.
    else if (f.kw && f.kw.length) {
      t.textContent = 'aucun mot-clé au-delà des noms';
      t.className = 'none';
    } else { t.textContent = 'pas encore de tags'; t.className = 'none'; }
    // La description en clair ; les mots-clés repliés (bouton, ou survol).
    // On REPLIE à chaque photo : un état ouvert qui suivrait d'une photo à
    // l'autre transformerait le confort en bruit.
    var d = document.getElementById('lb-desc');
    if (f.desc) { d.textContent = f.desc; d.className = ''; }
    else { d.textContent = 'pas encore de description'; d.className = 'none'; }
    t.hidden = true;
    document.getElementById('lb-kwbtn').setAttribute('aria-expanded', 'false');
    // Le dossier de la photo : « c'était quand / où, ça ? » → sa vue Dossiers.
    var fl = document.getElementById('lb-folder');
    // La vue DOSSIERS (/browse), pas la galerie filtree : c'est la vue du
    // repertoire que Mike a demandee (30/08, corrige 21:05 apres son essai).
    // `gurl` est `/files?dir=<i>/<rel>` -> on en derive `/browse/<i>/<rel>`,
    // et `#voir=<nom>` fait defiler la liste jusqu'au fichier, surligne.
    var gd = (f.gurl || '').split('?dir=')[1] || '';
    fl.href = (gd ? '/browse/' + gd : '/browse')
              + (f.name ? '#voir=' + encodeURIComponent(f.name) : '');
    fl.querySelector('.chemin').textContent = f.folder || 'Dossier';
    // Pas de date au jour pres -> pas de bouton (29 % de la photothèque en
    // est la). Le libelle porte le jour : « Même jour (14 août) », accent
    // compris — c'est ce que la page d'arrivee affiche.
    var jb = document.getElementById('lb-jour');
    jb.hidden = !f.jour;
    if (f.jour) jb.textContent = '📅 Même jour (' + jourLisible(f.jour) + ')';
  }
  // « 08-14 » -> « 14 aout ». Sans locale : toLocaleDateString depend du poste.
  // Les MOIS viennent du serveur (meme_jour.MOIS_FR, accentue) : la page
  // d'arrivee ecrit « 14 aout » avec son accent, le bouton qui y mene doit
  // ecrire le meme mot. Deux tableaux recopies avaient deja diverge.
  var MOIS_JOUR = __MOIS_JOUR__;
  function jourLisible(j) {
    var m = /^(\d{2})-(\d{2})$/.exec(j || '');
    return m ? (parseInt(m[2], 10) + ' ' + MOIS_JOUR[parseInt(m[1], 10) - 1]) : '';
  }
  function lbMove(d) {
    if (!visible.length) return;
    lbIdx = (lbIdx + d + visible.length) % visible.length;
    showLb();
  }
  function closeLb() {
    document.getElementById('lb').classList.remove('open');
    var vid = document.getElementById('lb-video');   // une video fermee se tait
    vid.pause(); vid.removeAttribute('src'); vid.load(); vid.hidden = true;
  }

  // controle: redondant -- fermer en cliquant a cote de la photo. Le meme
  // geste a deja son bouton (#lb-close) et sa touche (Echap) ; le fond
  // n'est pas un controle, c'est la zone qui reste.
  document.getElementById('lb').addEventListener('click', function(e) {
    if (e.target === this) closeLb();
  });

  // « Semblables » : navigation (page /files?sim=), pas un filtre client --
  // les résultats couvrent TOUTE la photothèque, pas le dossier courant.
  document.getElementById('lb-sim').addEventListener('click', function() {
    var f = visible[lbIdx];
    if (f && f.key) location.href = '/files?sim=' + encodeURIComponent(f.key);
  });

  // « Meme jour » : meme geste de navigation, mais par la DATE. On passe la
  // CLE (pas le jour) : le serveur en deduit le mois-jour ET ecarte la photo
  // de reference de ses propres resultats.
  document.getElementById('lb-jour').addEventListener('click', function() {
    var f = visible[lbIdx];
    if (f && f.key && f.jour) location.href = '/files?jour=' + encodeURIComponent(f.key);
  });

  // 5 bandes verticales : seules les bandes des bords (20%) naviguent
  // controle: redondant -- raccourci de souris pur. Les memes deux gestes
  // ont deja leurs boutons (#lb-prev, #lb-next) et leurs touches (fleches,
  // Echap), tous atteignables : aucune fonctionnalite n'est perdue au
  // clavier. Rendre l'image elle-meme focusable ajouterait un arret de
  // tabulation qui ne fait rien de plus.
  document.getElementById('lb-img').addEventListener('click', function(e) {
    var w = this.clientWidth;
    if (e.offsetX < w / 5) lbMove(-1);
    else if (e.offsetX > w * 4 / 5) lbMove(1);
  });

  // swipe gauche/droite
  var tsX = null, tsY = null;
  var lbEl = document.getElementById('lb');
  lbEl.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      tsX = e.touches[0].clientX;
      tsY = e.touches[0].clientY;
    }
  }, { passive: true });
  lbEl.addEventListener('touchend', function(e) {
    if (tsX === null) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    tsX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      lbMove(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  document.addEventListener('keydown', function(e) {
    if (document.getElementById('lb').classList.contains('open')) {
      if (e.key === 'ArrowLeft') lbMove(-1);
      if (e.key === 'ArrowRight') lbMove(1);
      if (e.key === 'Escape') closeLb();
    }
    if (document.getElementById('ss').classList.contains('open')) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); ssMove(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); ssMove(1); }
      if (e.key === ' ') { e.preventDefault(); ssTogglePause(); }
      if (e.key === 'Escape') stopSlideshow();
    }
  });

  // ── slideshow (respecte le filtre actif) ──
  var ssTimer = null;
  var ssIdx = 0;
  var ssMode = 'seq';
  var ssOrder = [];
  var DURATION = 10000;

  // met à jour le chip « dossier d'origine » du diaporama
  function ssSetFolder(it) {
    var fl = document.getElementById('ss-folder');
    if (it && it.gurl) {
      fl.href = it.gurl;
      fl.textContent = '📁 ' + (it.folder || 'Dossier');
      fl.classList.remove('hidden');
    } else {
      fl.classList.add('hidden');
    }
  }

  function buildOrder(m) {
    var arr = visible.map(function(_, i) { return i; });
    if (m === 'rnd') {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
    }
    // m === 'seq' : « Demo » suit l'ordre courant de la planche (tri + sens
    // choisis par l'utilisateur). arr est deja 0..n-1 dans l'ordre de `visible`,
    // donc on ne re-trie pas : on joue exactement ce que l'on voit.
    return arr;
  }

  function ssOpen() {
    var el = document.getElementById('ss');
    el.classList.add('open');
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) { try { req.call(el).catch(function() {}); } catch (e) {} }
  }

  // ── aléatoire en flux : démarrage instantané, photos piochées au fil de l'eau ──
  var rndStream = false;
  var rndHist = [];
  var rndPos = -1;
  var rndLoopMode = 'rnd';   // 'rnd' | 'seq' | 'asc' — comportement en fin de playlist
  var ssPaused = false;

  function shuffleItems(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function fetchPlaylist(mode, cb) {
    var d = new URLSearchParams(location.search).get('dir') || '0';
    fetch('/api/playlist?dir=' + encodeURIComponent(d) + '&mode=' + mode)
      .then(function(r) { return r.json(); })
      .then(function(j) { cb((j && j.items) ? j.items : []); })
      .catch(function() { cb([]); });
  }

  function ssTogglePause() {
    ssPaused = !ssPaused;
    var nameEl = document.getElementById('ss-name');
    if (ssPaused) {
      if (ssTimer) clearTimeout(ssTimer);
      ssTimer = null;
      // gèle la barre de progression à sa position actuelle
      var fill = document.getElementById('ss-fill');
      var w = getComputedStyle(fill).width;
      fill.style.transition = 'none';
      fill.style.width = w;
      nameEl.textContent = '⏸ ' + nameEl.textContent.replace(/^⏸ /, '');
    } else {
      // reprise : cycle complet sur la photo courante
      if (rndStream) {
        if (rndPos >= 0) rndShow(rndHist[rndPos]); else rndNext();
      } else {
        showSlide();
      }
    }
  }

  var streamMode = 'rnd';
  var rndErr = 0;

  function fetchRandom(cb) {
    var d = new URLSearchParams(location.search).get('dir') || '0';
    fetch('/api/random?dir=' + encodeURIComponent(d))
      .then(function(r) { return r.json(); })
      .then(function(j) { cb(j && j.url ? j : null); })
      .catch(function() { cb(null); });
  }

  function rndFetch(cb) {
    var last = (rndPos >= 0 && rndHist[rndPos]) ? rndHist[rndPos] : null;
    if (streamMode === 'asc' && last && last.key) {
      var ex = rndHist.slice(-15).map(function(it) { return it.key || ''; }).join('|');
      fetch('/api/assoc?prev=' + encodeURIComponent(last.key)
            + '&exclude=' + encodeURIComponent(ex))
        .then(function(r) { return r.json(); })
        .then(function(j) {
          if (j && j.url) cb(j);
          else fetchRandom(cb);  // pas d'association possible → pioche aléatoire
        })
        .catch(function() { fetchRandom(cb); });
      return;
    }
    fetchRandom(cb);
  }

  function rndShow(item) {
    var img = document.getElementById('ss-img');
    img.style.opacity = 0;
    img.src = thumbUrl(item, 1600);
    img.onload = function() {
      rndErr = 0;
      img.style.transition = 'opacity 0.5s';
      img.style.opacity = 1;
    };
    img.onerror = function() {
      // vignette serveur KO : retenter une fois l'original avant de passer
      if (item.url && img.src.indexOf('/api/thumb') >= 0) { img.src = item.url; return; }
      // image endommagée : on passe à la suivante sans l'afficher
      rndErr++;
      if (rndErr < 10) setTimeout(rndNext, 400);
    };
    var label = item.name || '';
    if (item.via && item.via.length) {
      label += '   —   lien : ' + item.via.join(' · ');
    }
    document.getElementById('ss-name').textContent = (ssPaused ? '⏸ ' : '') + label;
    ssSetFolder(item);
    ssStartFill();
    if (ssTimer) clearTimeout(ssTimer);
    ssTimer = ssPaused ? null : setTimeout(rndNext, DURATION);
  }

  function rndNext() {
    if (rndPos < rndHist.length - 1) {
      rndPos++;
      rndShow(rndHist[rndPos]);
      return;
    }
    // fin de la playlist pré-chargée
    if (!rndHist.length) {
      if (ssTimer) clearTimeout(ssTimer);
      ssTimer = setTimeout(rndNext, 2000);   // playlist pas encore prête
      return;
    }
    // on reboucle : re-mélange en aléatoire, ordre conservé sinon
    if (rndLoopMode === 'rnd') rndHist = shuffleItems(rndHist.slice());
    rndPos = 0;
    rndShow(rndHist[0]);
  }

  function rndPrev() {
    if (rndPos > 0) {
      rndPos--;
      rndShow(rndHist[rndPos]);
    }
  }

  function buildAssocOrder() {
    // ordonne 'visible' pour que chaque photo partage un tag avec la précédente
    var idx = visible.map(function(_, i) { return i; });
    if (idx.length < 2) return idx;
    var order = [idx[0]], used = {}; used[idx[0]] = 1;
    var cur = idx[0];
    while (order.length < idx.length) {
      var curkw = visible[cur].kw || [];
      var best = -1;
      for (var t = 0; t < idx.length; t++) {
        var j = idx[t];
        if (used[j]) continue;
        var kw = visible[j].kw || [];
        if (kw.some(function(x) { return curkw.indexOf(x) >= 0; })) { best = j; break; }
      }
      if (best < 0) {
        for (var u = 0; u < idx.length; u++) { if (!used[idx[u]]) { best = idx[u]; break; } }
      }
      order.push(best); used[best] = 1; cur = best;
    }
    return order;
  }

  function startSlideshow(m) {
    var localSel = selPersons.length > 0 || geoFilter != null;
    if (localSel) {
      // sélection personnes/géo : on joue toujours l'ensemble filtré localement
      if (!visible.length) return;
      ssPaused = false;
      rndStream = false;
      ssMode = m;
      ssOrder = (m === 'asc') ? buildAssocOrder() : buildOrder(m);
      ssIdx = 0;
      ssOpen();
      showSlide();
      return;
    }
    var filtered = selTags.length > 0 || qInput.value.trim() !== '';
    ssPaused = false;
    if (!filtered) {
      // Aucun filtre → on joue TOUTE la portée via une playlist ordonnée une
      // seule fois : aucune répétition (fini la pioche avec remise), seq
      // chronologique, association calculée sur l'ensemble.
      var plMode = (m === 'asc') ? 'assoc' : (m === 'rnd') ? 'rnd' : 'seq';
      rndStream = true;
      rndLoopMode = m;
      rndHist = [];
      rndPos = -1;
      rndErr = 0;
      ssOpen();
      document.getElementById('ss-name').textContent = 'Chargement…';
      fetchPlaylist(plMode, function(items) {
        if (!items.length) { document.getElementById('ss-name').textContent = 'Aucune photo'; return; }
        rndHist = items;
        rndPos = -1;
        rndNext();
      });
      return;
    }
    if (!visible.length) return;
    rndStream = false;
    ssMode = m;
    ssOrder = buildOrder(m);
    ssIdx = 0;
    ssOpen();
    showSlide();
  }

  function ssStartFill() {
    var fill = document.getElementById('ss-fill');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    if (ssPaused) return;
    setTimeout(function() {
      fill.style.transition = 'width ' + DURATION + 'ms linear';
      fill.style.width = '100%';
    }, 50);
  }

  function showSlide() {
    if (ssTimer) clearTimeout(ssTimer);
    ssTimer = null;

    var f = visible[ssOrder[ssIdx]];
    var img = document.getElementById('ss-img');
    img.style.opacity = 0;
    img.src = thumbUrl(f, 1600);
    img.onload = function() {
      img.style.transition = 'opacity 0.5s';
      img.style.opacity = 1;
    };
    img.onerror = function() {
      // vignette serveur KO : retenter une fois l'original avant de passer
      if (f.url && img.src.indexOf('/api/thumb') >= 0) { img.src = f.url; return; }
      if (!ssPaused) setTimeout(function() { ssMove(1); }, 300);
    };
    document.getElementById('ss-name').textContent = (ssPaused ? '⏸ ' : '') + f.name;
    ssSetFolder(f);

    ssStartFill();
    if (!ssPaused) {
      ssTimer = setTimeout(function() {
        ssIdx = (ssIdx + 1) % ssOrder.length;
        if (ssIdx === 0 && ssMode === 'rnd') ssOrder = buildOrder('rnd');
        showSlide();
      }, DURATION);
    }
  }

  function stopSlideshow() {
    rndStream = false;
    ssPaused = false;
    if (ssTimer) clearTimeout(ssTimer);
    ssTimer = null;
    document.getElementById('ss').classList.remove('open');
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (ex && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { ex.call(document).catch(function() {}); } catch (e) {}
    }
  }

  // navigation manuelle pendant le diaporama : il continue de tourner
  function ssMove(d) {
    if (rndStream) {
      if (d < 0) rndPrev(); else rndNext();
      return;
    }
    if (!ssOrder.length) return;
    ssIdx = (ssIdx + d + ssOrder.length) % ssOrder.length;
    showSlide();  // relance aussi le minuteur et la barre de progression
  }

  // 5 bandes verticales : bords = précédent/suivant, milieu = pause
  // controle: redondant -- meme raison que la visionneuse : #ss-stop, les
  // fleches et Echap font deja tout ce que ces bandes font.
  document.getElementById('ss-img').addEventListener('click', function(e) {
    var w = this.clientWidth;
    if (e.offsetX < w / 5) ssMove(-1);
    else if (e.offsetX > w * 4 / 5) ssMove(1);
    else ssTogglePause();
  });

  // swipe gauche/droite sur tout l'écran du diaporama
  var ssTX = null, ssTY = null;
  var ssEl2 = document.getElementById('ss');
  ssEl2.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      ssTX = e.touches[0].clientX;
      ssTY = e.touches[0].clientY;
    }
  }, { passive: true });
  ssEl2.addEventListener('touchend', function(e) {
    if (ssTX === null) return;
    var dx = e.changedTouches[0].clientX - ssTX;
    var dy = e.changedTouches[0].clientY - ssTY;
    ssTX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      ssMove(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && ssTimer) {
      stopSlideshow();
    }
  });
  document.addEventListener('webkitfullscreenchange', function() {
    if (!document.webkitFullscreenElement && !document.fullscreenElement && ssTimer) {
      stopSlideshow();
    }
  });

  // ── bandeau tagging IA ──
  // Il s'ANNONCE (role="status") : il apparait sans que rien n'ait ete clique,
  // et un lecteur d'ecran ne verrait sinon jamais passer l'analyse.
  // Et il ne se tait plus pour de bon : l'ancienne version ne se re-programmait
  // QUE tant qu'il restait des photos en attente — une fois la file vide, plus
  // aucun sondage, donc un envoi depuis le telephone n'allumait plus rien
  // jusqu'au prochain rechargement. On ralentit au lieu de s'arreter.
  function poll() {
    fetch('/api/status').then(function(r) { return r.json(); }).then(function(s) {
      var el = document.getElementById('pending');
      if (s.pending > 0) {
        el.style.display = 'block';
        el.textContent = '\u{1F3F7} ' + s.pending + ' photo(s) en cours d\'analyse IA\u2026';
        setTimeout(poll, 10000);
      } else if (s.tagged > INITIAL_TAGGED) {
        el.style.display = 'block';
        el.innerHTML = '\u2713 Nouveaux mots-cl\u00e9s disponibles \u2014 <a href="/files">actualiser la galerie</a>';
        setTimeout(poll, 60000);
      } else {
        el.style.display = 'none';
        setTimeout(poll, 60000);
      }
    }).catch(function() { setTimeout(poll, 60000); });
  }

  // ── init ──
  document.getElementById('btn-date').onclick = function() { sortBy('date'); };
  document.getElementById('btn-name').onclick = function() { sortBy('name'); };
  document.getElementById('btn-rel').onclick  = function() { sortBy('pertinence'); };
  document.getElementById('btn-seq').onclick  = function() { startSlideshow('seq'); };
  document.getElementById('btn-rnd').onclick  = function() { startSlideshow('rnd'); };
  document.getElementById('btn-asc').onclick  = function() { startSlideshow('asc'); };
  document.getElementById('lb-prev').onclick  = function() { lbMove(-1); };
  document.getElementById('lb-next').onclick  = function() { lbMove(1); };
  document.getElementById('lb-close').onclick = function() { closeLb(); };
  document.getElementById('ss-stop').onclick  = function() { stopSlideshow(); };
  document.getElementById('lb-kwbtn').onclick = function() {
    var t = document.getElementById('lb-tags');
    t.hidden = !t.hidden;
    this.setAttribute('aria-expanded', t.hidden ? 'false' : 'true');
  };

  buildTagbar();
  sortBy('date');
  poll();

  // ── filtre par motif (point 21) : navigation serveur (?motif=), lecture
  //    seule. Chips = liens ; actif en fixateur. Jamais une etiquette « rebut ».
  function motifNavUrl(m) {
    var params = new URLSearchParams(location.search);
    if (m) params.set('motif', m); else params.delete('motif');
    var qs = params.toString();
    return location.pathname + (qs ? '?' + qs : '');
  }
  function buildMotifbar() {
    var bar = document.getElementById('motifbar');
    var counts = (MOTIFS && MOTIFS.counts) || {};
    var sel = (MOTIFS && MOTIFS.sel) || '';
    var LABELS = {capture: "Captures d'\u00e9cran", document: 'Documents / scans',
                  facture: 'Re\u00e7us / factures'};
    var order = ['capture', 'document', 'facture'];
    var present = order.filter(function(k) { return counts[k]; });
    if (!present.length && !sel) { bar.className = 'motifbar'; return; }
    bar.innerHTML = '<span class="lbl">Motif :</span>';
    present.forEach(function(k) {
      var a = document.createElement('a');
      a.className = 'mchip' + (sel === k ? ' on' : '');
      a.href = motifNavUrl(sel === k ? '' : k);
      if (sel === k) a.setAttribute('aria-current', 'true');
      a.innerHTML = esc(LABELS[k] || k) + '<span class="n">' + counts[k] + '</span>';
      bar.appendChild(a);
    });
    if (sel) {
      var c = document.createElement('a');
      c.className = 'mchip'; c.href = motifNavUrl('');
      c.textContent = 'Tout afficher';
      bar.appendChild(c);
    }
    bar.className = 'motifbar show';
  }
  buildMotifbar();

  // ── suppression reversible depuis la visionneuse (point 21) ──
  // Le fichier part immediatement en quarantaine (.corbeille-rangement/, cote
  // serveur, re-cle de l'index compris) ; le toast offre l'annulation 10 s.
  var gToastEl = document.getElementById('gtoast'), gToastT = null;
  function gToast(msg, avecUndo) {
    gToastEl.innerHTML = '';
    var s = document.createElement('span'); s.textContent = msg;
    gToastEl.appendChild(s);
    if (avecUndo) {
      var b = document.createElement('button');
      b.className = 'b'; b.textContent = 'Annuler';
      b.onclick = function() {
        fetch('/api/files/undo', {method: 'POST',
          headers: {'Content-Type': 'application/json'}, body: '{}'})
          .then(function(r) { return r.json(); })
          .then(function(r) {
            if (r.ok) location.reload();
            else gToast(r.error || 'Rien \u00e0 annuler.', false);
          })
          .catch(function() { gToast('Le serveur n a pas r\u00e9pondu.', false); });
      };
      gToastEl.appendChild(b);
    }
    gToastEl.className = 'gtoast show';
    if (gToastT) clearTimeout(gToastT);
    gToastT = setTimeout(function() { gToastEl.className = 'gtoast'; },
                         avecUndo ? 10000 : 4000);
  }

  function removeCurrent() {
    var f = visible[lbIdx];
    function drop(arr) { var i = arr.indexOf(f); if (i >= 0) arr.splice(i, 1); }
    drop(FILES); drop(sorted); drop(visible);
    if (!visible.length) { closeLb(); renderGrid(); return; }
    if (lbIdx >= visible.length) lbIdx = visible.length - 1;
    renderGrid();
    showLb();
  }

  document.getElementById('lb-del').onclick = function() {
    var f = visible[lbIdx];
    if (!f) return;
    var btn = this; btn.disabled = true;
    fetch('/api/files/delete', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: f.key})})
      .then(function(r) { return r.json(); })
      .then(function(r) {
        btn.disabled = false;
        if (!r.ok) { gToast(r.error || 'Echec de la suppression.', false); return; }
        removeCurrent();
        gToast('Photo d\u00e9plac\u00e9e vers la corbeille.', true);
      })
      .catch(function() {
        btn.disabled = false;
        gToast('Le serveur n a pas r\u00e9pondu.', false);
      });
  };

  // ── filtres personnes + géo ──
  function haversine(la1, lo1, la2, lo2) {
    var R = 6371, d2r = Math.PI / 180;
    var dLa = (la2 - la1) * d2r, dLo = (lo2 - lo1) * d2r;
    var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) +
            Math.cos(la1 * d2r) * Math.cos(la2 * d2r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function updateSelInfo() {
    var parts = [];
    if (selPersons.length) parts.push(selPersons.length + ' personne(s)');
    if (geoFilter) parts.push('zone ' + geoFilter.km + ' km');
    document.getElementById('selinfo').textContent = parts.length ? ('· sélection : ' + parts.join(' + ')) : '';
  }
  var PERSONS = (function() {
    var s = {};
    FILES.forEach(function(f) {
      (f.kw || []).forEach(function(k) { if (k.indexOf('personne:') === 0) s[k] = 1; });
    });
    return Object.keys(s).sort();
  })();
  function renderPersonChips() {
    var box = document.getElementById('personchips'); box.innerHTML = '';
    if (!PERSONS.length) { box.innerHTML = '<span class="lbl">(aucune ici)</span>'; return; }
    PERSONS.forEach(function(tag) {
      var b = document.createElement('button');
      b.type = 'button';
      var actif = selPersons.indexOf(tag) >= 0;
      b.className = 'chip' + (actif ? ' on' : '');
      b.setAttribute('aria-pressed', actif ? 'true' : 'false');
      b.textContent = tag.slice(9);
      b.onclick = function() {
        var i = selPersons.indexOf(tag);
        if (i >= 0) selPersons.splice(i, 1); else selPersons.push(tag);
        renderPersonChips(); updateSelInfo(); applyFilter();
      };
      box.appendChild(b);
    });
  }
  renderPersonChips();

  var geoMap = null, geoCenter = null, geoMarker = null, geoCircle = null;
  function geoInit() {
    if (geoMap) { setTimeout(function() { geoMap.invalidateSize(); }, 60); return; }
    geoMap = L.map('geomap').setView([46.8, 8.2], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(geoMap);
    var pts = [];
    FILES.forEach(function(f) {
      if (f.gps) {
        L.circleMarker([f.gps[0], f.gps[1]], { radius: 3, color: '#4A8C7B', weight: 1, fillOpacity: 0.6 }).addTo(geoMap);  /* --fixateur */
        pts.push([f.gps[0], f.gps[1]]);
      }
    });
    if (pts.length) geoMap.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
    geoMap.on('click', function(e) { setGeoCenter(e.latlng.lat, e.latlng.lng); });
    setTimeout(function() { geoMap.invalidateSize(); }, 60);
  }
  function setGeoCenter(lat, lon) {
    geoCenter = [lat, lon];
    if (geoMarker) geoMap.removeLayer(geoMarker);
    geoMarker = L.marker([lat, lon]).addTo(geoMap);
    drawGeoCircle();
  }
  function drawGeoCircle() {
    if (!geoCenter) return;
    var km = parseInt(document.getElementById('georadius').value, 10);
    if (geoCircle) geoMap.removeLayer(geoCircle);
    geoCircle = L.circle(geoCenter, { radius: km * 1000, color: '#4A8C7B', fillOpacity: 0.08 }).addTo(geoMap);  /* --fixateur (zone) */
    var n = 0;
    FILES.forEach(function(f) {
      if (f.gps && haversine(geoCenter[0], geoCenter[1], f.gps[0], f.gps[1]) <= km) n++;
    });
    document.getElementById('geocount').textContent = '· ' + n + ' photo(s) dans la zone';
  }
  document.getElementById('geotoggle').onclick = function() {
    var p = document.getElementById('geopanel');
    var open = p.classList.toggle('open');
    this.classList.toggle('on', open);
    if (open) geoInit();
  };
  document.getElementById('georadius').oninput = function() {
    document.getElementById('georadlbl').textContent = this.value + ' km';
    drawGeoCircle();
  };
  document.getElementById('geoapply').onclick = function() {
    if (!geoCenter) { alert('Clique d\'abord un point sur la carte.'); return; }
    var km = parseInt(document.getElementById('georadius').value, 10);
    geoFilter = { lat: geoCenter[0], lon: geoCenter[1], km: km };
    updateSelInfo(); applyFilter();
  };
  document.getElementById('geoclear').onclick = function() {
    geoFilter = null;
    document.getElementById('geocount').textContent = '';
    updateSelInfo(); applyFilter();
  };

  // Page de resultats globale (/files?q=..., depuis un Lieu de /sujets ou un
  // marqueur de Carte) : le serveur a deja rempli la grille avec le resultat
  // de la recherche, dans l'ordre de pertinence. On se met en mode IA — pas de
  // filtre par mot-cle, tri par pertinence — pour que la barre reflete la
  // requete et qu'affiner reste possible. iaResultats = tout FILES (chaque
  // photo passe le test d'appartenance), rang = position renvoyee par le serveur.
  if (SEARCHQ) {
    qInput.value = SEARCHQ;
    modeIA = true;
    btnIA.className = 'btn tb active';
    btnIA.setAttribute('aria-pressed', 'true');
    qInput.placeholder = 'Décris la photo…';
    iaResultats = {};
    FILES.forEach(function(f, i) { iaResultats[f.key] = i; });
    montrerEspeceBar(true);
    lireDecomposition(SEARCHMETA || {});
    sortBy('pertinence');   // le serveur a deja classe : le bouton le dit
  }

  // lancement auto du diaporama après redirection récursive
  var pl = new URLSearchParams(location.search).get('play');
  if (pl === 'seq' || pl === 'rnd') {
    setTimeout(function() { startSlideshow(pl); }, 300);
  }
  // Arrivee depuis la visionneuse (« ouvrir le dossier de cette photo ») :
  // on montre la photo DANS son dossier, focus dessus (liseré --veilleuse
  // = « vous etes ici »), sans l'ouvrir : c'est le contexte qu'on venait voir.
  var vers = new URLSearchParams(location.search).get('vers');
  if (vers) {
    var vi = -1;
    for (var k = 0; k < visible.length; k++) {
      if (visible[k].name === vers || visible[k].key === vers) { vi = k; break; }
    }
    var vcell = vi >= 0 ? document.getElementById('grid').children[vi] : null;
    if (vcell) {
      // Le focus programme n'allume pas toujours `:focus-visible` (Chrome le
      // reserve au clavier) : la classe porte le meme lisere, a coup sur.
      vcell.classList.add('vers');
      setTimeout(function() {
        vcell.scrollIntoView({ block: 'center' });
        vcell.focus();
      }, 100);
    }
  }
})();
</script>
</body>
