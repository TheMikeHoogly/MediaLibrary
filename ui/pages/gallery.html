<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie photos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!--UI:components-->
<style>
/* Etape A tokenisation « chambre noire ». Filtres actifs (personne, tag, tri,
   geo) = fixateur (selection humaine) ; bandeau IA + barre de progression =
   veilleuse (en cours) ; « Tout effacer » = encre ; boutons primaires = papier ;
   focus = veilleuse. Grille repeat(5) laissee telle quelle (planche contact
   auto-fill = redesign etape B, point 11). Structure/espacements inchanges.
   Etape B (10/08) : les espacements/rayons/tailles qui EGALENT deja un token
   pointent vers lui (12px->--e-3, 8px->--e-2, 16px->--e-4, 0.75rem->--t-xs,
   0.85rem->--t-sm, 999px->--r-pill) — rendu identique, valeurs calculees
   prouvees. .pchip et .chip fusionnes en un seul jeu (fin de la divergence
   connue : ils etaient deux forks identiques) ; .pchip RETIRE le 26/08, la
   page prenant le chip de components.css.
   Passe DESIGN (11/08) : valeurs hors echelle calees sur les tokens, memes
   mappings que PEOPLE/PETS/MAP (0.8-0.82rem/13px -> --t-sm, 0.65-0.7rem ->
   --t-xs, 0.9rem -> --t-md, 1.1rem -> --t-lg, radius 8/10px -> --r-md,
   gaps/paddings -> echelle 4px : 5px -> --e-1, 6/7px -> --e-2, 10px -> --e-3,
   14/18px -> --e-4). Divergences tranchees : outline:none de #q RETIRE (le
   plancher base.css fournit l'anneau focus) ; le chip vient desormais de
   components.css (min-height --touch, 44 px depuis le 26/08 -- la valeur
   32 px que ce commentaire citait n'existe plus nulle part). Tailles fixes
   (180px, 300px, positions) non tokenisees. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; }
/* -- filtres personnes + geo -- */
.selbar { display: flex; align-items: center; gap: var(--e-2); padding: var(--e-2) var(--e-4);
          background: var(--salle-2); border-bottom: var(--trait); flex-wrap: wrap; }
.selbar .lbl { color: var(--graphite); font-size: var(--t-xs); margin-right: 2px; }
/* 26/08 : le chip vient de components.css. Ce bloc portait onze
   declarations dont NEUF etaient la feuille commune recopiee -- la page
   ecrivait le chip canonique sous ses propres noms sans le savoir, et deux
   endroits ou changer le meme composant sont une divergence qui attend son
   heure. `.pchip` etait un ALIAS EXACT de `.chip` (meme bloc, meme etat,
   un seul usage) : il disparait, son unique appel devient `chip`.
   Ce qui reste ici n'est que ce qui DIFFERE :
     - `user-select` : ecrit par cette seule page. Un vocabulaire ne devient
       canonique que quand deux pages l'ecrivent pareil sans se concerter --
       une seule, ca reste local, et ca se dit.
     - `.on` : cette page PEINT l'etat par une classe et le DIT par
       `aria-pressed`. La feuille commune ne connait que le second ; tant
       que les deux coexistent, la classe garde sa regle.
   Changement visuel volontaire : le compteur `.n` passe du graphite plein a
   l'opacite 0,7 de la feuille commune -- c'est deja ce que montre
   `subjects`, et c'est le but de la convergence. */
.chip { text-align: center; user-select: none; }
.chip.on { background: var(--fixateur); border-color: var(--fixateur); color: #fff; }
/* Converti au `.btn` canonique le 27/08 (option 1, tranchee par Mike) : la
   TAILLE, la forme, la police et les etats survol/presse viennent desormais de
   `components.css`. Ce qui reste ici ne PEINT que l'etat, et rien d'autre --
   une regle qui reposerait un padding ou une bordure recreerait la divergence
   qu'on vient de supprimer. Cout accepte et mesure : +19 px de hauteur de
   barres, pour des cibles au plancher tactile de 44 px.
   `.geobtn.on` pese (0,2,0) comme `.btn:hover`, et la page passe APRES
   `components.css` dans la cascade : l'etat actif ne se fait donc pas
   repeindre au survol. */
.geobtn.on { background: var(--fixateur); border-color: var(--fixateur); color: #fff; }
#geopanel { display: none; padding: var(--e-3) var(--e-4); background: var(--salle);
            border-bottom: var(--trait); }
#geopanel.open { display: block; }
#geomap { height: 300px; border-radius: var(--r-md); overflow: hidden; background: var(--salle-3); }
.georow { display: flex; align-items: center; gap: var(--e-3); margin-top: var(--e-2); flex-wrap: wrap; }
.georow input[type=range] { flex: 1; min-width: 140px; accent-color: var(--fixateur); }
.georow .cnt { color: var(--graphite); font-size: var(--t-sm); font-family: var(--f-donnees); }
.georow button.prim { background: var(--papier); border-color: var(--papier); color: var(--texte-papier); }

/* -- toolbar -- */
.bar { display: flex; align-items: center; gap: var(--e-3); padding: var(--e-4);
        background: var(--salle-2); border-bottom: var(--trait); flex-wrap: wrap; }
.back { color: var(--texte); text-decoration: none; font-size: var(--t-md); margin-right: auto; }
.btn-group { display: flex; gap: var(--e-2); }
.tb.active { background: var(--fixateur); border-color: var(--fixateur); color: #fff; }
.tb.demo { background: var(--salle-3); border-color: var(--graphite); }
.tb.demo.on { background: var(--fixateur); border-color: var(--fixateur); color: #fff; }
.count { color: var(--graphite); font-size: var(--t-sm); font-family: var(--f-donnees); }
#q { padding: var(--e-2) var(--e-3); border-radius: var(--r-md); border: var(--trait);
     background: var(--salle-3); color: var(--texte); font-size: var(--t-sm); width: 180px; }
#q:focus { border-color: var(--veilleuse); }

/* ── bandeau IA ── */
#pending { display: none; padding: var(--e-2) var(--e-4); background: var(--salle-2); color: var(--veilleuse);
           font-size: var(--t-sm); border-bottom: 1px solid var(--veilleuse-d); }
#pending a { color: var(--veilleuse); }

/* -- barre de tags -- */
.tagbar { display: flex; align-items: center; gap: var(--e-2); padding: var(--e-3) var(--e-4);
          background: var(--salle-2); border-bottom: var(--trait); flex-wrap: wrap; }
.chip.mode { background: var(--salle-3); border-color: var(--graphite); color: var(--texte); }
.chip.clear { background: transparent; border-color: var(--encre); color: var(--encre); display: none; }
.tagbar-label { color: var(--graphite); font-size: var(--t-xs); margin-right: var(--e-1); }
.tagchips { display: flex; flex-wrap: wrap; gap: var(--e-2); width: 100%; margin-top: var(--e-2); }
.tagchips.hidden { display: none; }

/* -- barre de dossiers -- */
.folders { display: flex; flex-wrap: wrap; gap: var(--e-2); padding: var(--e-3) var(--e-4);
           background: var(--salle-2); border-bottom: var(--trait); }
/* `.fchip` habillait DEUX natures sous un seul nom : des <a> qui NAVIGUENT et
   des <span> qui INFORMENT. Les convertir en bloc au `.btn` canonique aurait
   fait des etiquettes qui ressemblent a des boutons -- et le plancher n. 5 dit
   l'inverse : <button> pour agir, <a> pour naviguer, et rien qui fasse
   semblant. Trancher par Mike le 28/08 : deux noms, deux natures.
   Les <a> prennent `.btn` (cible 44 px, un seul vocabulaire) ; ce qui reste
   ici est l'ETIQUETTE, sans bordure ni curseur, pour qu'on ne puisse plus la
   confondre en la LISANT. */
.btn--nav { text-decoration: none; display: inline-flex; align-items: center; }
.fetiquette { padding: var(--e-2) var(--e-3); color: var(--graphite);
              font-size: var(--t-sm); }

/* ── grid ── */
/* Etape B : planche contact. Densite par auto-fill + clamp (jamais un nombre
   de colonnes en dur), gouttiere serree facon film. content-visibility sur les
   cellules pour tenir les grandes planches sans virtual scroll. */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 18vw, 168px), 1fr));
        gap: var(--e-1); padding: var(--e-2); background: var(--salle); }

.cell { background: var(--salle-3); border-radius: var(--r-sm); overflow: hidden; cursor: pointer;
        content-visibility: auto; contain-intrinsic-size: auto 210px; }
.cell .ph { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--salle-3); }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block;
             opacity: 0; transition: opacity 0.3s, transform 0.2s; }
.cell img.loaded { opacity: 1; }
/* Millesime en mode « meme jour » : une DONNEE sur la photo -> --f-donnees,
   comme le numero de vue d'une planche contact. */
.cell .an { position: absolute; bottom: 2px; left: 4px; font-family: var(--f-donnees);
            font-size: var(--t-xs); line-height: 1; color: var(--texte);
            text-shadow: 0 1px 2px #000; }
.cell:hover img { transform: scale(1.05); }
.caption { padding: var(--e-1) var(--e-2) var(--e-2); font-size: var(--t-xs); line-height: 1.25; color: var(--graphite);
           min-height: 2.3em; display: -webkit-box; -webkit-line-clamp: 2;
           -webkit-box-orient: vertical; overflow: hidden; }
.caption.empty { color: var(--graphite); font-style: italic; }
/* Faits : ce que le serveur SAIT de la photo (date . lieu . noms), par
   opposition a `.caption`, qui est ce qu'un modele en a DIT. Deux lignes
   distinctes et dans cet ordre : le fait porte sa provenance, la description
   non. Une seule ligne, jamais deux -- la planche vit de sa densite.
   Les noms passent en --texte et non --fixateur : #4A8C7B sur --salle-3
   mesure 4,45:1, sous le plancher AA de 4,5:1 a cette taille. */
.faits { padding: var(--e-1) var(--e-2) 0; font-size: var(--t-xs); line-height: 1.3;
         color: var(--graphite); white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; }
.faits .d { font-family: var(--f-donnees); }
.faits .n { color: var(--texte); }

/* -- lightbox -- */
#lb { display: none; position: fixed; inset: 0; background: #000;
       z-index: 100; flex-direction: column; }
#lb.open { display: flex; }
#lb-img { flex: 1; object-fit: contain; width: 100%; min-height: 0; }
/* Phase 1 des videos : la visionneuse tient un <video> a la place de l'image ;
   les deux occupent la meme boite, un seul est visible a la fois. */
#lb-video { flex: 1; object-fit: contain; width: 100%; min-height: 0; background: var(--salle); }
.cell .vid { position: absolute; top: 4px; left: 4px; font-family: var(--f-donnees);
  font-size: var(--t-xs); color: var(--texte); background: rgba(12,11,10,.72);
  padding: 2px 6px; border-radius: var(--r-sm); pointer-events: none; }
#lb-meta { background: var(--salle-2); padding: var(--e-3) var(--e-4) 0; }
/* Sous la photo (Mike, 30/08) : la DESCRIPTION en clair -- c'est elle qu'on
   lit -- et, a la place de la ligne de mots-cles, le DOSSIER de la photo
   (« tiens, c'etait quand / ou, ca ? » : un clic ramene a sa vue Dossiers).
   Les mots-cles restent la, replies : au survol de la zone, ou par le bouton
   « Mots-cles » -- un contenu qui n'apparait QU'au survol serait injoignable
   au doigt et au clavier (WCAG 1.4.13), le bouton est la version qui compte,
   le survol le confort souris. */
/* « Vous etes ici » a l'arrivee depuis la visionneuse (?vers=) : le lisere de
   focus, pose par une classe parce que Chrome n'allume pas :focus-visible
   sur un focus programme apres un clic. */
.cell.vers { outline: 2px solid var(--veilleuse); outline-offset: 2px; }
#lb-desc { font-size: var(--t-md); color: var(--texte); line-height: 1.45; }
#lb-desc.none { color: var(--graphite); font-style: italic; }
#lb-prov { display: flex; align-items: center; gap: var(--e-3); flex-wrap: wrap;
           margin-top: var(--e-2); }
#lb-folder { display: inline-flex; align-items: center; gap: var(--e-1); min-height: var(--touch);
             padding: 0 var(--e-3); border-radius: var(--r-pill); border: var(--trait);
             background: var(--salle-3); color: var(--texte); text-decoration: none;
             font-size: var(--t-sm); max-width: 100%; }
#lb-folder .chemin { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { #lb-folder:hover { background: var(--salle-4); } }
#lb-kwbtn { font-size: var(--t-sm); }
#lb-tags { font-size: var(--t-sm); color: var(--graphite); line-height: 1.4;
           margin-top: var(--e-2); }
#lb-tags.none { font-style: italic; }
#lb-tags[hidden] { display: none; }
/* Confort souris : la zone survolee devoile les mots-cles sans clic. Le
   `[hidden]` reste la verite pour le clavier et le doigt (bouton). */
@media (hover: hover) { #lb-meta:hover #lb-tags[hidden] { display: block; } }
/* Visionneuse : une photo a la fois, donc la place de DIRE la provenance
   (exif / nom du fichier / annee du dossier -- gps / chemin). C'est la
   promesse du projet : aucun fait affirme sans provenance. */
#lb-faits { font-size: var(--t-sm); color: var(--graphite); line-height: 1.5;
             margin-bottom: var(--e-2); }
#lb-faits .d { font-family: var(--f-donnees); color: var(--texte); }
#lb-faits .n { color: var(--texte); }
#lb-faits .src { font-size: var(--t-xs); color: var(--graphite); }
#lb-faits.none { font-style: italic; }
#lb-bar { background: var(--salle-2); padding: var(--e-3) var(--e-4); display: flex;
           align-items: center; gap: var(--e-3); flex-shrink: 0; flex-wrap: wrap; }
/* Telephone (mesure a 390px, 27/08) : en nowrap la rangee faisait 566px dans
   370 -- << Fermer >> etait HORS ECRAN, sans aucun defilement pour l'atteindre.
   Le repli garde chaque bouton entier et atteignable. Et nowrap sur les
   LIBELLES pour que ce soit le BOUTON qui passe a la ligne, jamais son texte :
   << Meme jour (31 mai) >> se pliait en quatre lignes de 78px de haut. */
#lb-bar .btn { white-space: nowrap; }
#lb-name { flex: 1; font-size: var(--t-sm); color: var(--graphite);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lb-close { font-size: var(--t-md); }
/* -- semblables / meme jour : navigation, pas une action -- neutre, cible 44px.
   Deux portes de sortie de la visionneuse : par le SENS (vecteur SigLIP) et par
   la DATE (meme mois-jour, toutes annees). Meme poids visuel, donc meme regle. */
#lb-sim, #lb-jour { font-size: var(--t-md); }
/* Le survol vient de `.btn` (--salle-4). La regle d ID qui posait --salle-2
   ici pesait (1,0,0) et gagnait sur la marche commune : deux profondeurs de
   survol pour un meme registre de bouton, c est le genre de divergence que
   cette conversion existe pour supprimer. */
#lb-jour[hidden] { display: none; }
/* Millesime d'une annee dans le bandeau « meme jour » : une MESURE, donc
   --f-donnees (plancher photo-ui : les nombres s'alignent et se comparent). */
.fetiquette.jour-an { font-family: var(--f-donnees); color: var(--graphite); }
.fetiquette.jour-an b { color: var(--texte); font-weight: 600; }
/* Plancher d'accessibilite n. 1 : focus visible. La page n'avait AUCUNE regle
   :focus-visible -- ecart releve en ajoutant « Meme jour », corrige ici pour
   toute la galerie plutot que pour le seul bouton neuf. */
:focus-visible { outline: 2px solid var(--veilleuse); outline-offset: 2px; }
/* #ss-fill exclu : sa transition n'est pas un ornement, c'est la seule
   indication du temps restant dans le diaporama. */
@media (prefers-reduced-motion: reduce) {
  *:not(#ss-fill), *::before, *::after { transition-duration: 0.01ms !important;
                                         animation-duration: 0.01ms !important; }
}
/* Les fleches gardent leur TAILLE DE TEXTE : ce sont deux glyphes, et le
   `.btn` canonique ecrit en --t-sm les rendrait minuscules. Tout le reste
   (hauteur, forme, bordure, survol, presse) vient de `.btn`. */
#lb-prev, #lb-next { font-size: var(--t-lg); }

/* -- slideshow -- */
#ss { display: none; position: fixed; inset: 0; background: #000;
       z-index: 200; flex-direction: column; }
#ss.open { display: flex; }
#ss-img { flex: 1; object-fit: contain; width: 100%; min-height: 0; }
#ss-footer { background: var(--salle); padding: var(--e-3) var(--e-4); flex-shrink: 0; }
#ss-name { font-size: var(--t-sm); color: var(--graphite); text-align: center; margin-bottom: var(--e-2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ss-folderwrap { text-align: center; margin-bottom: var(--e-2); }
#ss-folder { display: inline-block; color: var(--texte); background: var(--salle-3);
            border: var(--trait); border-radius: var(--r-md); padding: var(--e-1) var(--e-3);
            font-size: var(--t-sm); text-decoration: none; max-width: 80vw;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#ss-folder:hover { background: var(--salle-2); }
#ss-folder.hidden { display: none; }
#ss-track { height: 4px; background: var(--salle-3); border-radius: 2px; overflow: hidden; }
#ss-fill { height: 100%; background: var(--veilleuse); width: 0%; transition: width linear; }
/* Le fond translucide RESTE : ce bouton est pose sur une photo plein ecran,
   pas sur une barre. L'ID pese (1,0,0) et gagne donc sur `.btn` sans que
   personne ait a le forcer. Tout le reste -- taille, forme, police, survol --
   vient de `.btn`. */
#ss-stop { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.6);
            color: #fff; z-index: 201; }

/* -- barre de filtre par motif (point 21) : regroupe la vue par regle. Actif =
   fixateur (choix humain), coherent avec les chips personnes/tags. -- */
.motifbar { display: none; align-items: center; gap: var(--e-2); padding: var(--e-2) var(--e-4);
            background: var(--salle-2); border-bottom: var(--trait); flex-wrap: wrap; }
.motifbar.show { display: flex; }
.motifbar .lbl { color: var(--graphite); font-size: var(--t-xs); margin-right: 2px; }
/* 26/08 : 32px -> --touch, et `inline-flex`. Ce chip est un <a> bati par
   `document.createElement` : il etait donc `display: inline` par defaut, et
   un element inline non remplace IGNORE `min-height`. La regle etait ecrite,
   elle etait lue, et elle ne faisait rien -- meme piege que les chips en
   <span> du 26/08, un etage plus bas. Trouve par `verifier_cibles.py` le
   jour ou il a appris a voir ce que le JS BATIT : douze controles de cette
   page n'existaient pas pour lui. Le plancher a 44 px suit la decision de
   Mike du 26/08 (une seule regle, partout) ; `align-items` recentre ce que
   `line-height` tenait avant. */
.mchip { min-height: var(--touch); padding: var(--e-1) var(--e-3); border-radius: var(--r-pill); border: var(--trait);
         background: var(--salle-3); color: var(--graphite); font-size: var(--t-sm);
         display: inline-flex; align-items: center; gap: var(--e-1);
         cursor: pointer; text-decoration: none; }
.mchip.on { background: var(--fixateur); border-color: var(--fixateur); color: #fff; }
.mchip .n { font-family: var(--f-donnees); font-size: var(--t-xs); margin-left: var(--e-1); opacity: 0.75; }
.mchip.on .n { opacity: 1; }

/* Le bouton qui SUPPRIME une photo passe a `.btn--destructif` (27/08).
   Il etait en CONTOUR -- `--encre` en texte sur fond herite --, exactement la
   forme que le systeme a mesuree a **3,03:1** et remplacee par du PLEIN
   (5,34:1). Elle avait survecu ici parce que `verifier_contraste` ne lit que
   `tokens.css` et `components.css` : une couleur ecrite dans le <style> d une
   page n etait jugee par personne. La convertir, c est la faire entrer dans
   le perimetre mesure -- et un rouge plein pese plus lourd a l oeil, ce qu on
   veut d un << Supprimer >>. */
#lb-del { font-size: var(--t-md); }

/* -- toast d'annulation 10s (meme registre que /browse et /people) -- */
.gtoast { position: fixed; left: 50%; bottom: var(--e-4); transform: translateX(-50%);
          z-index: 300; display: none; gap: var(--e-3); align-items: center;
          max-width: 90vw; background: var(--salle-3); border: var(--trait);
          border-radius: var(--r-pill); padding: var(--e-3) var(--e-3) var(--e-3) var(--e-4); font-size: var(--t-sm);
          color: var(--texte); box-shadow: 0 8px 24px #0008; }
.gtoast.show { display: flex; }
/* 26/08 : 36px -> --touch. C'est le bouton << Annuler >> d'une action
   DESTRUCTIVE differee de 10 s -- celui qu'il faut pouvoir viser vite,
   et souvent au pouce. Il etait bati en JS, donc invisible au banc
   jusqu'a ce jour. */
.gtoast .b { min-height: var(--touch); padding: 0 var(--e-4); border-radius: var(--r-pill); border: var(--trait);
             background: var(--salle-2); color: var(--texte); cursor: pointer; }
</style>
</head>
<body>
<!--APPNAV-->

<div class="bar">
  <input type="search" id="q" placeholder="Recherche tags&hellip;">
  <button class="btn tb" id="btn-ia" aria-pressed="false"
          title="Recherche par le sens : d&eacute;cris la photo en fran&ccedil;ais">IA</button>
  <span class="count" id="cnt"></span>
  <!-- Page de RESULTATS : la barre ne cherche plus a chaque frappe (elle
       filtrerait dans le resultat precedent). Cet indice dit ce qu'il reste
       a faire — un compte faux serait pire qu'une touche a presser. -->
  <span class="count" id="relance" style="display:none">&#8629; Entr&eacute;e pour relancer</span>
  <div class="btn-group">
    <button class="btn tb active" id="btn-date" aria-pressed="true">Date</button>
    <button class="btn tb" id="btn-name" aria-pressed="false">Nom A-Z</button>
    <button class="btn tb" id="btn-rel" aria-pressed="false" style="display:none">Pertinence</button>
  </div>
  <div class="btn-group">
    <button class="btn tb demo" id="btn-seq">&#9654; Demo</button>
    <button class="btn tb demo" id="btn-rnd">&#9654; Aleatoire</button>
    <button class="btn tb demo" id="btn-asc" title="Chaque photo partage un tag avec la precedente">&#9654; Association</button>
  </div>
</div>

<!-- 5e axe : les puces INSERENT le jeton dans la requete au lieu de la
